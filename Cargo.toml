[package]
name = "survival"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Cameron Lyons <cameron.lyons2@gmail.com>"]
description = "A high-performance survival analysis library written in Rust with Python bindings"
license = "MIT"
repository = "https://github.com/Cameron-Lyons/survival"
keywords = [
  "survival-analysis",
  "statistics",
  "biostatistics",
  "cox-regression",
]
categories = ["science", "mathematics"]
include = [
  "/src/**",
  "/build.rs",
  "/benches/*.rs",
  "/tests/**",
  "/examples/*.rs",
  "/test/r/fixtures/*.json",
  "/test/r/kernel_references/*.json",
  "/python/tests/fixtures/aeq_large_time_reference.json",
  "/python/tests/fixtures/aj_entry_reference.json",
  "/python/tests/fixtures/egger_r_reference.json",
  "/python/tests/fixtures/km_infinite_reference.json",
  "/python/tests/fixtures/population_summary_reference.json",
  "/python/tests/fixtures/surv_quantile_reference.json",
  "/python/tests/fixtures/survfit_matrix_reference.json",
  "/python/tests/fixtures/survreg_density_reference.json",
  "/python/tests/fixtures/survreg_dpqr_parms_reference.json",
  "/python/tests/fixtures/survreg_dpqr_reference.json",
  "/python/tests/fixtures/weighted_logrank_reference.json",
  "/Cargo.toml",
  "/Cargo.lock",
  "/rust-toolchain.toml",
  "/pyproject.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[lib]
name = "survival"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", optional = true }
numpy = { version = "0.29.0", optional = true }
ndarray = { version = "0.17.2", features = ["serde"] }
rayon = "1.12.0"
burn = { version = "0.22.0", default-features = false, features = ["std", "autodiff", "ndarray", "optim"], optional = true }
survival-pyo3-macros-shim = { version = "0.1.0", path = "survival-pyo3-macros-shim" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"], optional = true }

[features]
default = []
python = ["dep:bincode", "dep:numpy", "dep:pyo3", "dep:pyo3-build-config"]
ml = ["dep:burn"]
extension-module = ["python", "pyo3/extension-module"]

[dev-dependencies]
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
divan = "0.1.21"

[build-dependencies]
pyo3-build-config = { version = "0.29.0", features = ["resolve-config"], optional = true }

[[bench]]
name = "survival_benchmarks"
harness = false

[[bench]]
name = "survfitaj_benchmarks"
harness = false

[[bench]]
name = "concordance_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = false

[profile.bench]
inherits = "release"
debug = true
