name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
          - crates
          - all
          - build
      ref:
        description: 'Existing tag or full commit SHA matching the workflow revision selected by --ref'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-publish-ref:
    name: Resolve Publish Ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve immutable ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_REF: ${{ github.event.inputs.ref || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$release_commit" != "$EVENT_SHA" ]]; then
              echo "Release tag no longer points to the release event commit." >&2
              exit 1
            fi
            requested_ref="$EVENT_SHA"
          else
            requested_ref="$MANUAL_REF"
          fi

          if [[ -z "$requested_ref" ]]; then
            echo "An existing tag name or full 40-character commit SHA is required." >&2
            exit 1
          fi

          if [[ "$requested_ref" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${requested_ref}^{commit}" 2>/dev/null; then
            resolved_ref="$requested_ref"
          elif git show-ref --tags --verify --quiet "refs/tags/$requested_ref"; then
            resolved_ref="$(git rev-list -n 1 "refs/tags/$requested_ref")"
          else
            echo "Publish ref must be an existing tag or full 40-character commit SHA." >&2
            exit 1
          fi

          if [[ "$resolved_ref" != "$EVENT_SHA" ]]; then
            echo "Package ref must identify the same commit as the workflow revision selected by --ref." >&2
            echo "Dispatch Publish from the matching branch or tag, with that commit's tag or full SHA as ref." >&2
            exit 1
          fi

          git checkout --detach "$EVENT_SHA"

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel (${{ matrix.platform.name }}, Python ${{ matrix.python.version }})
    if: github.event_name == 'release' || github.event.inputs.target != 'crates'
    runs-on: ${{ matrix.platform.runner }}
    needs: [resolve-publish-ref]
    strategy:
      fail-fast: false
      matrix:
        python:
          - { version: '3.11', abi: cp311 }
          - { version: '3.12', abi: cp312 }
          - { version: '3.13', abi: cp313 }
          - { version: '3.14', abi: cp314 }
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-aarch64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: '1.95.0'
          manylinux: ${{ runner.os == 'Linux' && '2014' || '' }}
          args: >-
            --release --locked --out dist --features extension-module,ml
            --interpreter "${{ runner.os == 'Linux' && format('/opt/python/{0}-{0}/bin/python', matrix.python.abi) || 'python' }}"

      - name: Install and smoke test the wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-publish-ref.outputs.version }}
        run: |
          python -m pip install --force-reinstall --only-binary=:all: dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version

          import survival
          import survival.r_api
          from survival import _survival

          assert survival.__version__ == version("survival") == os.environ["RELEASE_VERSION"]
          assert hasattr(_survival, "DeepSurv"), "ML bindings are missing from the wheel"
          response = survival.Surv([1.0, 2.0], [1, 0])
          print(f"Installed survival {survival.__version__}: {response}")
          PY

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}-${{ matrix.python.abi }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.target != 'crates'
    needs: [resolve-publish-ref]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    needs: [resolve-publish-ref, wheels, sdist]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/survival
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.target == 'pypi' || github.event.inputs.target == 'all'
    needs: [resolve-publish-ref, wheels, sdist]
    concurrency:
      group: pypi-${{ needs.resolve-publish-ref.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/survival
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.target == 'crates' || github.event.inputs.target == 'all'
    needs: [resolve-publish-ref]
    concurrency:
      group: crates-${{ needs.resolve-publish-ref.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version exists on crates.io
        id: check
        env:
          VERSION: ${{ needs.resolve-publish-ref.outputs.version }}
        run: |
          if curl -s -A "survival-release-workflow (https://github.com/Cameron-Lyons/survival)" "https://crates.io/api/v1/crates/survival/${VERSION}" | grep -q '"version"'; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} already exists on crates.io, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} not found on crates.io, will publish"
          fi

      - name: Check if shim version exists on crates.io
        id: check-shim
        run: |
          if curl -s -A "survival-release-workflow (https://github.com/Cameron-Lyons/survival)" "https://crates.io/api/v1/crates/survival-pyo3-macros-shim/0.1.0" | grep -q '"version"'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Shim version 0.1.0 already exists on crates.io, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Shim version 0.1.0 not found on crates.io, will publish"
          fi

      - name: Publish shim to crates.io
        if: steps.check.outputs.exists == 'false' && steps.check-shim.outputs.exists == 'false'
        run: cargo publish --manifest-path survival-pyo3-macros-shim/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for shim index availability
        if: steps.check.outputs.exists == 'false' && steps.check-shim.outputs.exists == 'false'
        run: |
          for attempt in {1..30}; do
            if curl -fsS -A "survival-release-workflow (https://github.com/Cameron-Lyons/survival)" "https://crates.io/api/v1/crates/survival-pyo3-macros-shim/0.1.0" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for survival-pyo3-macros-shim 0.1.0 on crates.io" >&2
          exit 1

      - name: Publish to crates.io
        if: steps.check.outputs.exists == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
