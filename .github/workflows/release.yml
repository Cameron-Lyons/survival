name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # GITHUB_TOKEN release events do not trigger another workflow. Dispatch is
      # explicitly exempt, and pins both the workflow tag and package commit.
      - name: Create GitHub Release and dispatch publishing
        run: python scripts/create_release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
