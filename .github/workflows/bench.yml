name: Benchmarks

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_BENCH_LTO: "false"
  CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
  CARGO_PROFILE_BENCH_STRIP: "none"
  RAYON_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Set up Python for report comparison
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Smoke test benchmarks (PR)
        run: cargo bench --locked --bench '*' -- --test

      - name: Run benchmarks (PR)
        # Keep stderr separate: Divan prints timer diagnostics while the first
        # stdout row is being written. Bash pipefail propagates benchmark errors.
        run: >-
          cargo bench --locked --bench '*' -- --color never --sample-count 100 --min-time 0.1 --max-time 1
          | tee "$RUNNER_TEMP/pr-bench.txt"

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Keep the PR's comparison helper and raw reports intact. Both builds
          # share the runner and the target cache, with Cargo tracking each source.
          path: .benchmark-base

      - name: Run benchmarks (base)
        working-directory: .benchmark-base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: >-
          cargo bench --locked --bench '*' -- --color never --sample-count 100 --min-time 0.1 --max-time 1
          | tee "$RUNNER_TEMP/base-bench.txt"

      - name: Compare benchmarks
        run: |
          python scripts/compare_benchmarks.py "$RUNNER_TEMP/base-bench.txt" "$RUNNER_TEMP/pr-bench.txt" --output "$RUNNER_TEMP/bench-comment.md"
          cat "$RUNNER_TEMP/bench-comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report and raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: |
            ${{ runner.temp }}/bench-comment.md
            ${{ runner.temp }}/pr-bench.txt
            ${{ runner.temp }}/base-bench.txt

  post-benchmark-comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    needs: [benchmark]
    if: github.event_name == 'pull_request' && needs.benchmark.result == 'success'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download benchmark comment
        uses: actions/download-artifact@v8
        with:
          name: benchmark-comment
          path: .

      - name: Post benchmark results
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: bench-comment.md
          header: benchmarks
