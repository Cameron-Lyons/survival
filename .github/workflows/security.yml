name: Security Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Run security audit
        # Match cargo-audit's warning policy for maintenance notices while
        # continuing to fail on vulnerabilities in any enabled dependency.
        run: cargo deny --locked check advisories --warn unmaintained

  miri:
    name: Miri (Undefined Behavior)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup

      # The full library suite runs natively in CI; interpret shared core helpers here.
      - name: Run Miri on core helper tests
        shell: bash
        run: >-
          cargo +nightly miri test --locked --lib --no-default-features internal:: -- --test-threads=1
        env:
          # R reference assertions require host precision rather than injected rounding errors.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-no-extra-rounding-error

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
