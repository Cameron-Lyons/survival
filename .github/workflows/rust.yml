name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.94.0
  # Warnings are denied in CI only (not in .cargo/config.toml) so local
  # iteration is not blocked while the gate is still enforced on every PR.
  RUSTFLAGS: -Dwarnings

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The `python` feature tests embed this interpreter and exercise the
      # NumPy boundary types, so NumPy must be importable from it.
      - name: Install NumPy for the embedded-interpreter tests
        run: python -m pip install numpy

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-

      - name: Run Rust tests (once per feature set)
        run: |
          cargo test --lib --no-default-features
          cargo test --lib --features ml
          cargo test --lib --features python,ml

      - name: Run doctests
        run: cargo test --doc

      - name: Run public Rust API integration tests
        run: cargo test --test '*' --no-default-features

  build-smoke:
    name: Wheel Numerical Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Install maturin and numerical test dependencies
        run: python -m pip install maturin numpy pandas polars pytest

      - name: Clean old wheels
        run: rm -rf target/wheels || true
        shell: bash

      - name: Build wheel with maturin
        run: maturin build --locked --release --interpreter python --features extension-module,ml

      - name: Install wheel (Unix)
        if: matrix.os != 'windows-latest'
        run: pip install target/wheels/survival-*.whl

      - name: Install wheel (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $wheel = Get-ChildItem -Path target/wheels -Filter "survival-*.whl" | Select-Object -First 1
          pip install $wheel.FullName

      - name: Verify the installed wheel is used
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import survival
          import survival._survival as native

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (survival, native):
              location = Path(module.__file__).resolve()
              if location.is_relative_to(workspace):
                  raise SystemExit(f"Expected installed wheel, imported {location}")
              print(location)
          PY

      # Frozen stock-R references require no R installation. Exercise the wheel's
      # numerical results, ndarray conversions, formula types and callback/pickle
      # paths on both supported platforms, beyond loading the shared library.
      - name: Run installed-wheel numerical tests
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/python/tests/test_r_fixtures.py" \
            "$GITHUB_WORKSPACE/python/tests/test_array_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_survreg_callbacks.py" \
            "$GITHUB_WORKSPACE/python/tests/test_aft_prediction_probabilities.py" \
            "$GITHUB_WORKSPACE/python/tests/test_summary_counts.py" \
            "$GITHUB_WORKSPACE/python/tests/test_aj_entry_grid.py" \
            "$GITHUB_WORKSPACE/python/tests/test_neardate_sortable.py" \
            "$GITHUB_WORKSPACE/python/tests/test_survmean_reference.py" \
            "$GITHUB_WORKSPACE/python/tests/test_confidence_band_reference.py" \
            "$GITHUB_WORKSPACE/python/tests/test_strata_iterable_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_surv_iterable_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_factor_iterable_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_formula_iterator_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_population_iterable_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_model_matrix_iterator_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_masked_matrix_formula_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_population_summary_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_km_infinite_times.py" \
            "$GITHUB_WORKSPACE/python/tests/test_survfit_frame_endpoints.py" \
            "$GITHUB_WORKSPACE/python/tests/test_curve_quantile_boundaries.py" \
            "$GITHUB_WORKSPACE/python/tests/test_curve_quantile_scales.py" \
            "$GITHUB_WORKSPACE/python/tests/test_rmst_comparison_inputs.py" \
            "$GITHUB_WORKSPACE/python/tests/test_surv_repetition.py" \
            "$GITHUB_WORKSPACE/python/tests/test_aft_rank_deficient.py" \
            "$GITHUB_WORKSPACE/python/tests/test_factor_formula_comparisons.py" \
            "$GITHUB_WORKSPACE/python/tests/test_ordered_factor_contrasts.py" \
            "$GITHUB_WORKSPACE/python/tests/test_formula_numeric_classification.py" \
            "$GITHUB_WORKSPACE/python/tests/test_typed_formula_expressions.py" \
            "$GITHUB_WORKSPACE/python/tests/test_model_frame_transport.py" \
            "$GITHUB_WORKSPACE/python/tests/test_survfit_missing_residuals.py"

  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Install maturin and test dependencies
        run: pip install maturin numpy pandas polars pytest matplotlib

      - name: Clean old wheels
        run: rm -rf target/wheels || true

      - name: Build and install
        run: |
          maturin build --release --interpreter python --features extension-module,ml
          pip install target/wheels/survival-*.whl

      - name: Run Python tests
        run: python -m pytest --import-mode=importlib python/tests/ -v

  # Builds with the lean `extension-module` feature set (no `ml`), so this is
  # the one run of the Python suite that exercises the no-ML skip paths.
  python-source-tree:
    name: Python Source Tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-develop-py3.14-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-develop-py3.14-

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install maturin and test dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin numpy pandas polars pytest matplotlib

      - name: Remove any preinstalled survival package
        run: .venv/bin/python -m pip uninstall -y survival || true

      - name: Install extension with maturin develop
        run: .venv/bin/maturin develop --release

      - name: Verify extension import path
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("survival._survival")
          if spec is None or spec.origin is None:
              raise SystemExit("Could not locate survival._survival")
          print(spec.origin)
          PY

      - name: Check API/stub/example consistency
        run: .venv/bin/python -m pytest python/tests/test_binding_contract.py -v

      - name: Run Python tests against source-tree install
        run: .venv/bin/python -m pytest python/tests/ -v

  # Regenerates test/r/fixtures with the exact survival version recorded in
  # the fixture metadata and fails on any diff. This checks that the committed
  # fixtures are reproducible, not that the crate matches R (that is what
  # python/tests/test_r_fixtures.py and src/tests/r_fixtures.rs do).
  r-fixture-stability:
    name: R Fixture Stability
    runs-on: ubuntu-latest
    env:
      # CRAN spelling of test/r/fixtures/*.json -> metadata.survival_version
      # (packageVersion() reports it as 3.8.11).
      R_SURVIVAL_VERSION: '3.8-11'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the pin matches the fixture metadata
        run: |
          recorded="$(jq -r '.metadata.survival_version' test/r/fixtures/coxph.json)"
          pinned="${R_SURVIVAL_VERSION//-/.}"
          if [ "$recorded" != "$pinned" ]; then
            echo "R_SURVIVAL_VERSION ($pinned) does not match test/r/fixtures metadata ($recorded)" >&2
            exit 1
          fi
          echo "survival pin $R_SURVIVAL_VERSION matches fixture metadata"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install pinned survival and jsonlite
        run: |
          repos <- c(CRAN = "https://cloud.r-project.org")
          install.packages(c("remotes", "jsonlite"), repos = repos)
          wanted <- Sys.getenv("R_SURVIVAL_VERSION")
          remotes::install_version("survival", version = wanted, repos = repos, upgrade = "never")
          installed <- as.character(packageVersion("survival"))
          if (installed != gsub("-", ".", wanted, fixed = TRUE)) {
            stop(sprintf("installed survival %s but expected %s", installed, wanted))
          }
          cat("survival", installed, "installed\n")
        shell: Rscript {0}

      - name: Keep the committed fixtures
        run: cp -r test/r/fixtures "$RUNNER_TEMP/committed-fixtures"

      - name: Regenerate fixtures
        run: Rscript test/r/generate_fixtures.R

      # The fixtures are single-line JSON, so `git diff` would print one
      # unreadable line per file; compare_fixtures.py names the case and
      # field of every differing value instead.  The tolerance absorbs
      # last-ulp differences between builds of R (BLAS, libm); anything a
      # survival release or generator edit changes is far larger.
      - name: Check for differences
        run: |
          if python3 test/r/compare_fixtures.py "$RUNNER_TEMP/committed-fixtures" test/r/fixtures --rtol 1e-9 --atol 1e-12; then
            echo "R fixtures are up to date"
          else
            echo "R fixtures changed. Regenerate with survival ${R_SURVIVAL_VERSION} and commit, or bump R_SURVIVAL_VERSION together with the fixture metadata." >&2
            exit 1
          fi

      - name: Upload the regenerated fixtures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-r-fixtures
          path: test/r/fixtures
          retention-days: 7

  r-bridge:
    name: R Bridge Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-r-bridge-py3.14-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-r-bridge-py3.14-

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Create Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin numpy pandas polars pytest

      - name: Install Python extension
        run: .venv/bin/maturin develop --release --features extension-module,ml

      # The bridge follows current response/status and multi-state label semantics.
      # Historical numerical fixtures are regenerated separately with their own pin.
      - name: Install R bridge dependencies
        run: |
          rspm <- Sys.getenv("RSPM", unset = "")
          repos <- if (nzchar(rspm)) c(CRAN = rspm) else c(CRAN = "https://cloud.r-project.org")
          install.packages(c("reticulate", "testthat", "remotes", "jsonlite"), repos = repos)
          wanted <- Sys.getenv("R_SURVIVAL_VERSION")
          remotes::install_version(
            "survival", version = wanted, repos = c(CRAN = "https://cloud.r-project.org"),
            upgrade = "never"
          )
          installed <- as.character(packageVersion("survival"))
          if (installed != gsub("-", ".", wanted, fixed = TRUE)) {
            stop(sprintf("installed survival %s but expected %s", installed, wanted))
          }
        shell: Rscript {0}
        env:
          R_SURVIVAL_VERSION: '3.8-12'

      - name: Regenerate current-stock formula, survival and exact-risk references
        run: |
          fixture_dir="$RUNNER_TEMP/current-stock-fixtures"
          mkdir -p "$fixture_dir/committed" "$fixture_dir/regenerated"
          cp python/tests/fixtures/typed_formula_expression_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survfit_missing_residual_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/summary_counts_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/aj_entry_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survmean_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/confidence_band_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/strata_iterable_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/surv_iterable_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/factor_iterable_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/formula_iterator_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/population_iterable_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/model_matrix_iterator_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/masked_matrix_formula_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/km_infinite_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survfit_frame_endpoint_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/curve_quantile_boundary_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/aft_prediction_probability_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/surv_repetition_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/aeq_large_time_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/tmerge_iterable_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/weighted_logrank_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/aggregate_fun_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/cox_survfit_subset_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/cox_survfit_single_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/rsurvreg_count_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/penalty_constructor_reference.json "$fixture_dir/committed/"
          cp test/r/kernel_references/exact_counting_sweep.json "$fixture_dir/committed/"
          Rscript scripts/generate_typed_formula_expression_reference.R \
            "$fixture_dir/regenerated/typed_formula_expression_reference.json"
          Rscript scripts/generate_survfit_missing_residual_reference.R \
            "$fixture_dir/regenerated/survfit_missing_residual_reference.json"
          Rscript scripts/generate_summary_counts_reference.R \
            "$fixture_dir/regenerated/summary_counts_reference.json"
          Rscript scripts/generate_aj_entry_reference.R \
            "$fixture_dir/regenerated/aj_entry_reference.json"
          Rscript scripts/generate_survmean_reference.R \
            "$fixture_dir/regenerated/survmean_reference.json"
          Rscript scripts/generate_confidence_band_reference.R \
            "$fixture_dir/regenerated/confidence_band_reference.json"
          Rscript scripts/generate_strata_iterable_reference.R \
            "$fixture_dir/regenerated/strata_iterable_reference.json"
          Rscript scripts/generate_surv_iterable_reference.R \
            "$fixture_dir/regenerated/surv_iterable_reference.json"
          Rscript scripts/generate_factor_iterable_reference.R \
            "$fixture_dir/regenerated/factor_iterable_reference.json"
          Rscript scripts/generate_formula_iterator_reference.R \
            "$fixture_dir/regenerated/formula_iterator_reference.json"
          Rscript scripts/generate_population_iterable_reference.R \
            "$fixture_dir/regenerated/population_iterable_reference.json"
          Rscript scripts/generate_model_matrix_iterator_reference.R \
            "$fixture_dir/regenerated/model_matrix_iterator_reference.json"
          Rscript scripts/generate_masked_matrix_formula_reference.R \
            "$fixture_dir/regenerated/masked_matrix_formula_reference.json"
          Rscript scripts/generate_km_infinite_reference.R \
            "$fixture_dir/regenerated/km_infinite_reference.json"
          Rscript scripts/generate_survfit_frame_endpoint_reference.R \
            "$fixture_dir/regenerated/survfit_frame_endpoint_reference.json"
          Rscript scripts/generate_curve_quantile_boundary_reference.R \
            "$fixture_dir/regenerated/curve_quantile_boundary_reference.json"
          Rscript scripts/generate_aft_prediction_probability_reference.R \
            "$fixture_dir/regenerated/aft_prediction_probability_reference.json"
          Rscript scripts/generate_surv_repetition_reference.R \
            "$fixture_dir/regenerated/surv_repetition_reference.json"
          Rscript scripts/generate_aeq_large_time_reference.R \
            "$fixture_dir/regenerated/aeq_large_time_reference.json"
          Rscript scripts/generate_tmerge_iterable_reference.R \
            "$fixture_dir/regenerated/tmerge_iterable_reference.json"
          Rscript scripts/generate_weighted_logrank_reference.R \
            "$fixture_dir/regenerated/weighted_logrank_reference.json"
          Rscript scripts/generate_aggregate_fun_reference.R \
            "$fixture_dir/regenerated/aggregate_fun_reference.json"
          Rscript scripts/generate_cox_survfit_subset_reference.R \
            "$fixture_dir/regenerated/cox_survfit_subset_reference.json"
          Rscript scripts/generate_cox_survfit_single_reference.R \
            "$fixture_dir/regenerated/cox_survfit_single_reference.json"
          Rscript scripts/generate_rsurvreg_count_reference.R \
            "$fixture_dir/regenerated/rsurvreg_count_reference.json"
          Rscript scripts/generate_penalty_constructor_reference.R \
            "$fixture_dir/regenerated/penalty_constructor_reference.json"
          Rscript scripts/generate_exact_counting_reference.R \
            "$fixture_dir/regenerated/exact_counting_sweep.json"
          python test/r/compare_fixtures.py "$fixture_dir/committed" "$fixture_dir/regenerated" \
            --rtol 1e-9 --atol 1e-12

      - name: Regenerate rank-deficient AFT references
        run: |
          fixture_dir="$RUNNER_TEMP/current-stock-fixtures/aft-rank-deficient"
          mkdir -p "$fixture_dir/committed" "$fixture_dir/regenerated"
          cp python/tests/fixtures/aft_rank_deficient_reference.json "$fixture_dir/committed/"
          Rscript scripts/generate_aft_rank_deficient_reference.R \
            "$fixture_dir/regenerated/aft_rank_deficient_reference.json"
          python test/r/compare_fixtures.py "$fixture_dir/committed" "$fixture_dir/regenerated" \
            --rtol 3e-7 --atol 3e-8

      - name: Regenerate AFT distribution query references
        run: |
          fixture_dir="$RUNNER_TEMP/current-stock-fixtures/survreg-dpqr"
          mkdir -p "$fixture_dir/committed" "$fixture_dir/regenerated"
          cp python/tests/fixtures/survreg_dpqr_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survreg_dpqr_callback_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survreg_dpqr_callback_edges.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survreg_dpqr_empty_reference.json "$fixture_dir/committed/"
          cp python/tests/fixtures/survreg_dpqr_parms_reference.json "$fixture_dir/committed/"
          Rscript scripts/generate_survreg_dpqr_reference.R "$fixture_dir/regenerated"
          Rscript scripts/generate_survreg_dpqr_parms_reference.R "$fixture_dir/regenerated"
          python test/r/compare_fixtures.py "$fixture_dir/committed" "$fixture_dir/regenerated" \
            --rtol 0 --atol 0

      # High-degree polynomial columns amplify BLAS rounding in R's QR.
      # Keep this independent comparison separate from the established gate.
      - name: Regenerate ordered-factor contrast references
        run: |
          fixture_dir="$RUNNER_TEMP/current-stock-fixtures/ordered-factor"
          mkdir -p "$fixture_dir/committed" "$fixture_dir/regenerated"
          cp python/tests/fixtures/ordered_factor_reference.json "$fixture_dir/committed/"
          Rscript scripts/generate_ordered_factor_reference.R \
            "$fixture_dir/regenerated/ordered_factor_reference.json"
          python test/r/compare_fixtures.py "$fixture_dir/committed" "$fixture_dir/regenerated" \
            --rtol 1e-9 --atol 1e-7

      - name: Upload regenerated current-stock references
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: current-stock-r-fixtures
          path: ${{ runner.temp }}/current-stock-fixtures
          if-no-files-found: ignore
          retention-days: 7

      - name: Check R bridge package
        run: |
          check_dir="$RUNNER_TEMP/r-bridge-check"
          mkdir -p "$check_dir"
          cd "$check_dir"
          R CMD build --no-manual --no-build-vignettes "$GITHUB_WORKSPACE/r/survivalr"
          R CMD check --no-manual --no-build-vignettes survivalr_*.tar.gz
          grep -q '^Status: OK$' survivalr.Rcheck/00check.log
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python

      - name: Upload R bridge check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r-bridge-check
          path: ${{ runner.temp }}/r-bridge-check/survivalr.Rcheck
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
