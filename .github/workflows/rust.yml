name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.94.0
  # Warnings are denied in CI only (not in .cargo/config.toml) so local
  # iteration is not blocked while the gate is still enforced on every PR.
  RUSTFLAGS: -Dwarnings

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The `python` feature tests embed this interpreter and exercise the
      # NumPy boundary types, so NumPy must be importable from it.
      - name: Install NumPy for the embedded-interpreter tests
        run: python -m pip install numpy

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-

      - name: Run Rust tests (once per feature set)
        run: |
          cargo test --lib --no-default-features
          cargo test --lib --features ml
          cargo test --lib --features python,ml

      - name: Run doctests
        run: cargo test --doc

  build-smoke:
    name: Build Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Install maturin
        run: pip install maturin

      - name: Clean old wheels
        run: rm -rf target/wheels || true
        shell: bash

      - name: Build wheel with maturin
        run: maturin build --release --interpreter python --features extension-module,ml

      - name: Install wheel (Unix)
        if: matrix.os != 'windows-latest'
        run: pip install target/wheels/survival-*.whl

      - name: Install wheel (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $wheel = Get-ChildItem -Path target/wheels -Filter "survival-*.whl" | Select-Object -First 1
          pip install $wheel.FullName

      # Only verify the extension loads on this platform; the test suites run on
      # ubuntu in the rust-tests and python-matrix jobs.
      - name: Import installed extension
        working-directory: ${{ runner.temp }}
        run: python -c "import survival._survival as m; print(m.__file__)"

  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Install maturin and test dependencies
        run: pip install maturin numpy pandas polars pytest

      - name: Clean old wheels
        run: rm -rf target/wheels || true

      - name: Build and install
        run: |
          maturin build --release --interpreter python --features extension-module,ml
          pip install target/wheels/survival-*.whl

      - name: Run Python tests
        run: python -m pytest --import-mode=importlib python/tests/ -v

  # Builds with the lean `extension-module` feature set (no `ml`), so this is
  # the one run of the Python suite that exercises the no-ML skip paths.
  python-source-tree:
    name: Python Source Tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-develop-py3.14-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-develop-py3.14-

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install maturin and test dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin numpy pandas polars pytest

      - name: Remove any preinstalled survival package
        run: .venv/bin/python -m pip uninstall -y survival || true

      - name: Install extension with maturin develop
        run: .venv/bin/maturin develop --release

      - name: Verify extension import path
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("survival._survival")
          if spec is None or spec.origin is None:
              raise SystemExit("Could not locate survival._survival")
          print(spec.origin)
          PY

      - name: Check API/stub/example consistency
        run: .venv/bin/python -m pytest python/tests/test_binding_contract.py -v

      - name: Run Python tests against source-tree install
        run: .venv/bin/python -m pytest python/tests/ -v

  # Regenerates test/r/fixtures with the exact survival version recorded in
  # the fixture metadata and fails on any diff. This checks that the committed
  # fixtures are reproducible, not that the crate matches R (that is what
  # python/tests/test_r_fixtures.py and src/tests/r_fixtures.rs do).
  r-fixture-stability:
    name: R Fixture Stability
    runs-on: ubuntu-latest
    env:
      # CRAN spelling of test/r/fixtures/*.json -> metadata.survival_version
      # (packageVersion() reports it as 3.8.11).
      R_SURVIVAL_VERSION: '3.8-11'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the pin matches the fixture metadata
        run: |
          recorded="$(jq -r '.metadata.survival_version' test/r/fixtures/coxph.json)"
          pinned="${R_SURVIVAL_VERSION//-/.}"
          if [ "$recorded" != "$pinned" ]; then
            echo "R_SURVIVAL_VERSION ($pinned) does not match test/r/fixtures metadata ($recorded)" >&2
            exit 1
          fi
          echo "survival pin $R_SURVIVAL_VERSION matches fixture metadata"

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install pinned survival and jsonlite
        run: |
          repos <- c(CRAN = "https://cloud.r-project.org")
          install.packages(c("remotes", "jsonlite"), repos = repos)
          wanted <- Sys.getenv("R_SURVIVAL_VERSION")
          remotes::install_version("survival", version = wanted, repos = repos, upgrade = "never")
          installed <- as.character(packageVersion("survival"))
          if (installed != gsub("-", ".", wanted, fixed = TRUE)) {
            stop(sprintf("installed survival %s but expected %s", installed, wanted))
          }
          cat("survival", installed, "installed\n")
        shell: Rscript {0}

      - name: Regenerate fixtures
        run: Rscript test/r/generate_fixtures.R

      - name: Check for differences
        run: |
          if git diff --exit-code test/r/fixtures; then
            echo "R fixtures are up to date"
          else
            echo "R fixtures changed. Regenerate with survival ${R_SURVIVAL_VERSION} and commit, or bump R_SURVIVAL_VERSION together with the fixture metadata." >&2
            exit 1
          fi

  r-bridge:
    name: R Bridge Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-r-bridge-py3.14-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-r-bridge-py3.14-

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Create Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin numpy pandas polars pytest

      - name: Install Python extension
        run: .venv/bin/maturin develop --release --features extension-module,ml

      - name: Install R bridge dependencies
        run: |
          rspm <- Sys.getenv("RSPM", unset = "")
          repos <- if (nzchar(rspm)) c(CRAN = rspm) else c(CRAN = "https://cloud.r-project.org")
          install.packages(c("reticulate", "survival", "testthat"), repos = repos)
        shell: Rscript {0}

      - name: Check R bridge package
        run: R CMD check --no-manual --no-build-vignettes r/survivalr
        env:
          RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
