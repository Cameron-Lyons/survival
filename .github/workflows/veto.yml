name: Veto

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/rust.yml
    secrets: inherit
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit
  security:
    uses: ./.github/workflows/security.yml
    secrets: inherit
  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit
  msrv:
    uses: ./.github/workflows/msrv.yml
  semver:
    uses: ./.github/workflows/semver.yml
  benchmarks:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/bench.yml
    secrets: inherit
  veto:
    name: Veto
    runs-on: ubuntu-latest
    needs: [ci, lint, security, coverage, msrv, semver, benchmarks]
    if: always()
    steps:
      - name: Require every workflow to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["CI_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required workflows did not pass: {failed}")
          print("All required workflows passed")
          PYTHON
