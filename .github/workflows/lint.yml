name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The single place that runs rustfmt + clippy for the main crate.
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --features ml -- -D warnings
          cargo clippy --all-targets --features python,ml -- -D warnings

      - name: Check for unused dependencies
        run: |
          cargo install cargo-machete --locked --version 0.9.1 --force
          cargo machete

  # The fuzz and proc-macro shim crates are separate packages, so `cargo fmt
  # --all` / `cargo clippy` at the repo root do not cover them.
  rust-lint-aux:
    name: Rust Lint & Format (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [fuzz, survival-pyo3-macros-shim]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.crate }}/target/
          key: ${{ runner.os }}-cargo-lint-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ matrix.crate }}-

      - name: Check formatting
        run: cargo fmt --all --manifest-path ${{ matrix.crate }}/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings

  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python lint dependencies
        run: uv sync --extra dev --extra test --no-install-project

      - name: Check formatting
        run: uv run --no-sync ruff format python/ test/ --check

      - name: Lint code
        run: uv run --no-sync ruff check python/ test/

      - name: Type check stubs
        run: uv run --no-sync mypy python/survival/__init__.pyi python/survival/_survival.pyi python/survival/r/__init__.pyi --ignore-missing-imports

      # `python3 scripts/generate_stubs.py --check` needs the built extension (with the ml
      # feature) and runs in coverage.yml next to the binding-manifest check.

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for typos
        uses: crate-ci/typos@v1.49.0
        with:
          config: .typos.toml

  veto:
    name: Veto
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-lint-aux, python-lint, typos]
    if: always()
    steps:
      - name: Check all lint jobs passed
        run: |
          if [[ "${{ needs.rust-lint.result }}" != "success" ]] || \
             [[ "${{ needs.rust-lint-aux.result }}" != "success" ]] || \
             [[ "${{ needs.python-lint.result }}" != "success" ]] || \
             [[ "${{ needs.typos.result }}" != "success" ]]; then
            echo "One or more lint jobs failed"
            exit 1
          fi
          echo "All lint jobs passed"
