[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.mypy.overrides]]
module = "survival.pybridge"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.coverage.run]
branch = true
source = ["python/survival"]

[tool.coverage.report]
show_missing = true
skip_empty = true
