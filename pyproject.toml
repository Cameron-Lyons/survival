[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "survival"
version = "3.0.0"
description = "A high-performance survival analysis library written in Rust with Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cameron Lyons", email = "cameron.lyons2@gmail.com" }]
maintainers = [{ name = "Cameron Lyons", email = "cameron.lyons2@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
keywords = [
  "survival-analysis",
  "kaplan-meier",
  "cox-regression",
  "statistics",
  "biostatistics",
  "rust",
]
dependencies = [
  "numpy>=1.20.0",
]

[project.urls]
Repository = "https://github.com/Cameron-Lyons/survival"
Documentation = "https://github.com/Cameron-Lyons/survival#python-package-layout"
Issues = "https://github.com/Cameron-Lyons/survival/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
  "pre-commit==4.7.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
]
test = [
  "matplotlib>=3.8",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pandas==3.0.6",
  "polars==2.0.0",
]

[tool.maturin]
features = ["extension-module"]
module-name = "survival._survival"
python-source = "python"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "W",
  "UP",
  "S",
  "B",
  "A",
  "C4",
  "PT",
  "RET",
  "SIM",
  "ERA",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["S101", "PT017", "S603", "S110", "N806"]
"python/tests/*.py" = ["S101", "PT017", "N806"]
"*.pyi" = ["A002"]
"python/survival/__init__.pyi" = ["F401"]
"python/survival/_sklearn_aft.py" = ["N803", "N806", "UP037"]
